name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen --python ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run --extra dev pytest -v

      - name: Verify CLI version and built-in examples
        run: |
          uv run keyflow --version
          uv run keyflow outline -i README.md --stage1 >/dev/null
          for f in examples/*.json; do
            uv run keyflow validate -i "$f"
            uv run keyflow audit -i "$f" --strict
            uv run keyflow compile -i "$f" -o "out/$(basename "$f" .json).keyx"
          done
