[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyflow"
version = "0.4.0"
description = "Native-first Keynote (.keyx) compiler and iterative design toolkit for agent-designed presentations"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "creator-studio-doc-format>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/johhhhnny/keyflow"
Repository = "https://github.com/johhhhnny/keyflow"
Issues = "https://github.com/johhhhnny/keyflow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
keyflow = "keyflow.cli:main"
keyflow-mcp = "keyflow.mcp_server:main"

[tool.setuptools.packages.find]
include = ["keyflow*"]

[tool.setuptools.package-data]
keyflow = ["themes/*.json"]
